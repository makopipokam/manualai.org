<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <title>manualAI.org - App Auswahl</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --primary: #4CAF50;
            --primary-hover: #45a049;
            --border: #dddddd;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-light: #b0b0b0;
            --border: #404040;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .app-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary), #66bb6a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .app-card h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        .app-card p {
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .app-tag {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
        }

        .pwnd-card .app-icon {
            background: linear-gradient(135deg, #1c2631, #24213d);
        }

        .pwnd-card .app-tag {
            background: rgba(91, 173, 255, 0.1);
            color: #5cadff;
        }

        .mydog-card .app-tag {
            background: rgba(76, 175, 80, 0.1);
            color: var(--primary);
        }

        footer {
            margin-top: 60px;
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .dark-mode-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: var(--shadow);
            z-index: 1000;
            transition: background 0.3s ease;
        }

        .dark-mode-toggle:hover {
            background: var(--primary-hover);
        }

        .dark-mode-toggle:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }
            
            .apps-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 manualAI.org</h1>
            <p>Wähle eine App aus</p>
        </header>

        <div class="apps-grid">
            <!-- PWND App Card -->
            <a href="/pwnd/" class="app-card pwnd-card">
                <div class="app-icon">π</div>
                <h2>pwnd</h2>
                <p>Quizbattle - Teste dein Wissen mit KI-gestützten Fragen und Herausforderungen</p>
                <span class="app-tag">🧠 Quiz & Lernen</span>
            </a>

            <!-- MyDog App Card -->
            <a href="/mydog/" class="app-card mydog-card">
                <div class="app-icon">🐕</div>
                <h2>MyDog</h2>
                <p>Finde deinen perfekten Hund basierend auf deinem Persönlichkeitstest</p>
                <span class="app-tag">🐾 Hundesuche</span>
            </a>
        </div>

        <footer>
            <p>© 2024 manualAI.org | <a href="https://manualai.org">Zurück zur Hauptseite</a></p>
        </footer>
    </div>

    <button id="dark-mode-toggle" class="dark-mode-toggle" title="Dark Mode">🌙</button>

    <script>
        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let darkMode = localStorage.getItem('app_darkMode') === 'true' || prefersDark;

        function updateDarkMode() {
            if (darkMode) {
                document.documentElement.setAttribute('data-theme', 'dark');
                darkModeToggle.textContent = '☀️';
            } else {
                document.documentElement.removeAttribute('data-theme');
                darkModeToggle.textContent = '🌙';
            }
            localStorage.setItem('app_darkMode', darkMode);
        }

        darkModeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            updateDarkMode();
        });

        // Initialize
        updateDarkMode();
    </script>
</body>
</html>
