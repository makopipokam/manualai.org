<meta name="description" content="manualAI is a learning companion that shows you how to find answers yourself.">
<style>
:root{
  --sun:#FFCF4A;
  --sun-soft:#FFF0B8;
  --plum:#2B1B3D;
  --plum-2:#5A4A6B;
  --paper:#FFFCF6;
  --line:#E6DDEA;
  --white:#fff;
  --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sun-soft);color:var(--plum);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
[hidden]{display:none !important}

.app{height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper)}
@media (min-width:680px){.app{border-inline:1px solid var(--line)}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--sun);transition:border-radius .2s}
.app.chatting .top{border-radius:0 0 22px 22px}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:34px;height:34px;flex:none}
.wordmark{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.01em;margin:0}
.tools{display:flex;gap:8px;align-items:center}
.tools select{min-height:40px;border:0;background:var(--white);border-radius:999px;padding:0 12px;font-weight:600}
.iconbtn{width:40px;height:40px;border:0;border-radius:50%;background:var(--white);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* scroll area */
main{flex:1;overflow-y:auto;scroll-behavior:smooth}

/* hero */
.hero{background:var(--sun);border-radius:0 0 34px 34px;padding:6px 18px 28px}
.hero-row{display:flex;gap:10px;align-items:flex-end}
h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,9vw,42px);line-height:1.06;letter-spacing:-.01em;margin:0;flex:1}
.fish{width:92px;flex:none;margin-bottom:-2px}
.sub{margin:12px 0 0;max-width:36ch;font-size:17px}

.wbody{padding:22px 16px 12px}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 4px}
.hint{color:var(--plum-2);font-size:14px;margin:0 0 12px}

/* setup */
fieldset{border:0;margin:0 0 22px;padding:0;min-width:0}
legend{font-family:var(--display);font-weight:600;font-size:19px;padding:0;margin-bottom:2px}
.opt{position:relative;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;margin-bottom:10px;border:2px solid var(--line);border-radius:20px;background:var(--white);cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){border-color:var(--plum);background:var(--sun-soft)}
.opt:has(input:focus-visible){outline:3px solid var(--plum);outline-offset:2px}
.ic{width:44px;height:44px;border-radius:14px;background:var(--sun);display:grid;place-items:center;color:var(--plum)}
.ic svg{width:24px;height:24px}
.opt:has(input:checked) .ic{background:var(--plum);color:var(--sun)}
.txt{display:flex;flex-direction:column;min-width:0}
.txt strong{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2}
.txt .d{color:var(--plum-2);font-size:14.5px;line-height:1.35;margin-top:2px}
.opt:has(input:checked) .txt .d{color:var(--plum)}
.meter{display:flex;gap:4px}
.meter i{width:9px;height:9px;border-radius:50%;border:2px solid var(--plum)}
.meter i.on{background:var(--plum)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.seg label{text-align:center;padding:10px 4px;border:2px solid var(--line);border-radius:999px;background:var(--white);font-weight:600;cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--plum);border-color:var(--plum);color:var(--white)}
.seg label:has(input:focus-visible){outline:3px solid var(--plum);outline-offset:2px}
.done{display:none;width:100%;min-height:46px;border:0;border-radius:999px;background:var(--plum);color:var(--white);font-weight:600}
.setup.sheet{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:14px 14px 12px;margin-bottom:10px;max-height:56dvh;overflow:auto}
.setup.sheet .done{display:block}
.setup.sheet fieldset{margin-bottom:14px}

/* examples */
.ex{display:block;width:100%;text-align:left;background:var(--white);border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-height:46px;margin-bottom:8px;font-weight:600}
.ex:hover{border-color:var(--plum)}
.contact{margin:0;padding:22px 16px 28px;text-align:center;color:var(--plum-2);font-size:14px}
.contact a{display:inline-block;padding:8px 2px;color:var(--plum);font-weight:600}
.clear{border:0;background:none;color:var(--plum-2);text-decoration:underline;font-size:14px;padding:8px 2px;min-height:40px}

/* messages */
#messages{display:flex;flex-direction:column;gap:12px;padding:16px}
#messages:empty{padding:0}
.brow{display:flex;gap:8px;align-items:flex-end;max-width:94%;align-self:flex-start}
.av{width:28px;height:28px;flex:none}
.msg{padding:10px 14px;border-radius:20px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;max-width:88%;background:var(--plum);color:var(--white);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.bot{background:var(--sun-soft);border-bottom-left-radius:6px;min-width:0}
.msg.bot p{margin:0 0 .6em}
.msg.bot p:last-child,.msg.bot ul:last-child,.msg.bot ol:last-child{margin-bottom:0}
.msg.bot ul,.msg.bot ol{margin:0 0 .6em;padding-left:1.3em}
.msg.bot code{background:var(--white);padding:1px 5px;border-radius:6px;font-size:.92em}
.msg.bot pre{background:var(--white);padding:10px 12px;border-radius:12px;overflow-x:auto;margin:0 0 .6em}
.msg.bot pre code{padding:0;background:none}
.msg.bot a{color:var(--plum);font-weight:600}
.note{align-self:center;color:var(--plum-2);font-size:14px;text-align:center}
.note.err{color:#8A1F11;font-weight:600}
.thinking .msg{display:flex;align-items:center;color:var(--plum-2)}
.thinking .av{animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(2px)}to{transform:translateY(-4px)}}

/* dock */
.dock{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.banner{background:var(--sun-soft);border:2px solid var(--sun);border-radius:18px;padding:10px 12px;margin-bottom:10px}
.banner p{margin:0 0 8px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.banner button{min-height:40px;border-radius:999px;padding:0 16px;border:2px solid var(--plum);background:transparent;font-weight:600}
.banner button.primary{background:var(--plum);color:var(--white)}
.mode{display:inline-flex;gap:8px;align-items:baseline;border:2px solid var(--line);background:var(--white);border-radius:999px;padding:4px 12px;margin-bottom:8px;min-height:36px;font-size:14px;font-weight:600}
.mode .chg{font-weight:500;color:var(--plum-2);text-decoration:underline}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;border:2px solid var(--line);border-radius:24px;background:var(--white);padding:10px 16px;min-height:48px;max-height:160px;line-height:1.4}
.send{width:48px;height:48px;flex:none;border:0;border-radius:50%;background:var(--plum);color:var(--sun);display:grid;place-items:center}
.send svg{width:22px;height:22px}
.send:disabled{opacity:.45;cursor:default}

.iconbtn.signed{position:relative}
.iconbtn.signed::after{content:"";position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;background:#2E9E5B;border:2px solid var(--white)}
.txtin{width:100%;min-height:48px;border:2px solid var(--line);border-radius:16px;background:var(--white);padding:0 14px;font-size:16px}
.txtin.code{font-size:22px;letter-spacing:.25em}
.chatrow{display:flex;gap:8px;margin-bottom:8px}
.chatopen{flex:1;min-width:0;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--white)}
.chatopen strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatopen span{font-size:13px;color:var(--plum-2)}
.chatdel{flex:none;width:48px;border:2px solid var(--line);border-radius:16px;background:var(--white);display:grid;place-items:center;color:var(--plum)}
.chatdel svg{width:20px;height:20px}
.dangerlnk{color:#8A1F11}
/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(43,27,61,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:640px;max-height:92dvh;overflow:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));outline:none}
.panel h2{font-size:24px;margin:0 0 10px}
.panel h3{font-family:var(--display);font-weight:600;font-size:17px;margin:18px 0 4px}
.panel h4{font-size:15px;margin:12px 0 2px}
.panel p{margin:0 0 10px}
.panel ul{margin:0 0 10px;padding-left:1.2em}
.panel .hint{margin:0 0 6px}
.bigbtn{display:block;width:100%;text-align:left;padding:16px;margin-bottom:10px;border:2px solid var(--line);border-radius:20px;background:var(--white);font-size:17px}
.bigbtn:hover{border-color:var(--plum)}
.bigbtn strong{font-family:var(--display);font-weight:600}
.btn{display:block;width:100%;min-height:48px;margin:10px 0 0;border:0;border-radius:999px;background:var(--plum);color:var(--white);font-weight:600}
.btn.ghost{background:transparent;color:var(--plum);border:2px solid var(--plum)}
.fl{display:block;font-weight:600;margin:12px 0 4px}
.pin{width:100%;min-height:48px;border:2px solid var(--line);border-radius:16px;background:var(--white);padding:0 14px;font-size:20px;letter-spacing:.3em}
.chk{display:flex;gap:10px;align-items:flex-start;margin:16px 0 4px}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--plum)}
.oerr{color:#8A1F11;font-weight:600;min-height:1.4em;margin:8px 0 0}
.ovlang{min-height:40px;border:2px solid var(--line);border-radius:999px;background:var(--white);padding:0 12px;font-weight:600;margin-bottom:14px}
.profline{margin:0 0 6px}
.links{margin:0;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.lnk{border:0;background:none;color:var(--plum);text-decoration:underline;font-weight:600;padding:8px 2px;min-height:40px}
.panel .links{justify-content:flex-start;margin-top:8px}
.panel .contact{text-align:left;padding:10px 0 4px;font-size:15px}
mark.ph{background:#FFD1D1;color:#5C0F0F;padding:0 3px;border-radius:4px}
.legal{font-size:15px;line-height:1.55}
.fine{margin:8px 2px 0;font-size:12.5px;color:var(--plum-2);text-align:center}
.botcol{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.report{border:0;background:none;color:var(--plum-2);font-size:13px;text-decoration:underline;padding:6px 4px;min-height:32px}
@media (max-width:420px){
  .top{padding:10px}
  .brand{gap:7px}
  .brand svg{width:30px;height:30px}
  .wordmark{font-size:20px}
  .tools{gap:6px}
  .tools select{padding:0 6px 0 10px;font-size:14px}
  .iconbtn{width:38px;height:38px}
}
@media (max-width:340px){.wordmark{display:none}}

@media (prefers-reduced-motion:reduce){.thinking .av{animation:none}main{scroll-behavior:auto}.top{transition:none}}
</style>
</head>

  <main id="scroll">

    </div>
    <p class="fine" id="fine"></p>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel" role="dialog" aria-modal="true" tabindex="-1"></div></div>

/* ---------- history (stored on this device only) ---------- */
const HKEY = "history";
function getHistory(){
  try{ const a = JSON.parse(store.get(HKEY) || "[]"); return Array.isArray(a) ? a.filter(x => typeof x === "string") : []; }
  catch{ return []; }
}
function saveHistory(text){
  text = text.trim();
  if(text.length < 8 || text.length > 160) return;
  const h = getHistory().filter(x => x !== text);
  h.unshift(text);
  store.set(HKEY, JSON.stringify(h.slice(0, 20)));
}
const SKEY = "sugg";
let suggInFlight = false, suggFailedKey = null;
const histKey = (top) => state.lang + "|" + top.join("\n");
function getCachedSugg(top){
  try{
    const c = JSON.parse(store.get(SKEY) || "null");
    return c && c.key === histKey(top) && Array.isArray(c.items) && c.items.length ? c.items : null;
  }catch{ return null; }
}
async function fetchSugg(top){
  if(suggInFlight) return;
  suggInFlight = true;
  const key = histKey(top);
  try{
    const r = await fetch("/api/suggest", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ history: top, lang: state.lang })
    });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if(!Array.isArray(d.items) || !d.items.length) throw new Error("empty");
    store.set(SKEY, JSON.stringify({ key, items: d.items.filter(x => typeof x === "string").slice(0, 3) }));
  }catch(err){
    console.error(err);
    suggFailedKey = key;
  }finally{
    suggInFlight = false;
    if(!started()) renderRecent();
  }
}
function renderRecent(){
  if(isKids()){ els.examples.innerHTML = ""; els.recent.hidden = true; return; }
  const all = getHistory();
  const top = all.slice(0, 5);
  const cached = top.length ? getCachedSugg(top) : null;
  let items, title;
  if(cached){ items = cached; title = T().forYou; }
  else{
    items = all.slice(0, 3); title = T().recentTitle;
    if(top.length && !started() && histKey(top) !== suggFailedKey) fetchSugg(top);
  }
  let direct = false;
  if(!items.length){ items = T().examplesList; title = T().examplesTitle; direct = true; }
  $("tryTitle").textContent = title;
  els.clearHist.hidden = direct;
  els.examples.innerHTML = "";
  items.forEach(text => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "ex"; b.textContent = text;
    b.addEventListener("click", () => { if(direct){ send(text); } else { els.input.value = text; autosize(); els.input.focus(); } });
    els.examples.appendChild(b);
  });
  els.recent.hidden = items.length === 0 || started();
}

/* ---------- rendering helpers ---------- */
const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function inline(s){
  return s
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

function md(src){
  const lines = esc(src).split("\n");
  let html = "", para = [], list = null;
  const flushPara = () => { if(para.length){ html += "<p>"+inline(para.join("<br>"))+"</p>"; para = []; } };
  const flushList = () => { if(list){ html += "<"+list.t+">"+list.items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</"+list.t+">"; list = null; } };
  for(let i=0;i<lines.length;i++){
    const l = lines[i];
    if(l.trim().startsWith("```")){
      flushPara(); flushList();
      const code = []; i++;
      while(i<lines.length && !lines[i].trim().startsWith("```")){ code.push(lines[i]); i++; }
      html += "<pre><code>"+code.join("\n")+"</code></pre>";
      continue;
    }
    let m;
    if((m = l.match(/^#{1,6}\s+(.*)/))){ flushPara(); flushList(); html += "<p><strong>"+inline(m[1])+"</strong></p>"; continue; }
    if((m = l.match(/^\s*[-*]\s+(.*)/))){ flushPara(); if(!list || list.t!=="ul"){ flushList(); list={t:"ul",items:[]}; } list.items.push(m[1]); continue; }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ flushPara(); if(!list || list.t!=="ol"){ flushList(); list={t:"ol",items:[]}; } list.items.push(m[1]); continue; }
    if(!l.trim()){ flushPara(); flushList(); continue; }
    flushList(); para.push(l);
  }
  flushPara(); flushList();
  return html;
}

/* reads the streamed answer (one JSON object per line) into the live bubble */
async function readStream(r, live, st){
  const bubble = live.querySelector(".msg");
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = "", raf = 0, done = false;
  const paint = () => {
    raf = 0;
    const stick = els.scroll.scrollHeight - els.scroll.scrollTop - els.scroll.clientHeight < 140;
    bubble.innerHTML = md(st.acc);
    if(stick) scrollDown();
  };
  const handle = (line) => {
    if(!line.trim()) return;
    let o; try{ o = JSON.parse(line); }catch{ return; }
    if(o.t === "delta" && typeof o.text === "string"){
      if(!st.acc){ live.classList.remove("thinking"); live.removeAttribute("role"); }
      st.acc += o.text;
      if(!raf) raf = requestAnimationFrame(paint);
    }else if(o.t === "done"){ done = true; st.suggestion = o.suggestion || null; }
    else if(o.t === "error"){ throw new Error("stream error"); }
  };
  try{
    for(;;){
      const { value, done: end } = await reader.read();
      if(end) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while((i = buf.indexOf("\n")) >= 0){ handle(buf.slice(0, i)); buf = buf.slice(i + 1); }
    }
    buf += dec.decode(); handle(buf);
  }finally{ if(raf) cancelAnimationFrame(raf); }
  if(!done) throw new Error("stream ended early");
}

async function send(text){
  text = (text || "").trim();
  if(!text || state.busy || !state.profile) return;
  hideBanner();
  els.messages.querySelectorAll(".err").forEach(n => n.remove());
  if(state.sheetOpen) closeSheet();
  if(!started() && !isKids()) saveHistory(text);
  startConversation();

  state.messages.push({ role:"user", content:text });
  const userEl = addMsg("user", text);
  els.input.value = ""; autosize();
  setBusy(true);
  updateMode();
  const live = addThinking();
  const ctrl = new AbortController();
  state.abort = ctrl;
  const st = { acc:"", suggestion:null };

  const finish = (reply, suggestion) => {
    live.replaceWith(buildBotRow(reply));
    state.messages.push({ role:"assistant", content:reply });
    persist("user", text);
    persist("assistant", reply);
    if(suggestion) showBanner(suggestion);
    scrollDown();
  };

  try{
    const r = await fetch("/api/chat", {
      method:"POST",
      headers: await authHeaders(),
      signal: ctrl.signal,
      body: JSON.stringify({
        messages: state.messages.slice(-30), turn: countTurns(), stream: true,
        level: state.level, dial: state.dial, style: isKids() ? "simple" : state.style, profile: state.profile
      })
    });
    if(r.status === 429){
      let scope = "user";
      try{ scope = (await r.json()).scope || "user"; }catch{}
      const e = new Error("limit"); e.limit = scope; throw e;
    }
    if(!r.ok) throw new Error("HTTP " + r.status);

    if((r.headers.get("content-type") || "").includes("ndjson")){
      await readStream(r, live, st);
      if(!st.acc.trim()) throw new Error("empty answer");
      finish(st.acc, st.suggestion);
    }else{
      const data = await r.json();
      if(data.blocked){
        live.remove();
        state.messages.pop();
        addMsg("bot", data.blocked === "care" ? T().blockedCare : T().blockedUnsafe);
      }else{
        const reply = String(data.reply ?? "");
        if(!reply.trim()) throw new Error("empty answer");
        finish(reply, data.suggestion);
      }
    }
  }catch(err){
    const aborted = err && err.name === "AbortError";
    if(aborted && st.acc.trim()){
      finish(st.acc, null);            /* stopped by the user: keep what was written */
    }else{
      if(!aborted) console.error(err);
      live.remove();
      state.messages.pop();
      userEl.remove();
      els.input.value = text; autosize();
      if(!started()){ resetToWelcome(); }
      if(!aborted) addNote(err && err.limit ? (err.limit === "global" ? T().limitGlobal : T().limitUser) : T().error, true);
    }
  }finally{
    state.abort = null;
    setBusy(false);
    if(matchMedia("(pointer:fine)").matches) els.input.focus();
  }
}

async function hashPin(pin, salt){
  const buf = new TextEncoder().encode(salt + ":" + pin);
  const d = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function randomSalt(){
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2, "0")).join("");
}
function setProfile(p){
  state.profile = p; store.set("profile", p);
  if(p === "kids"){ store.set(HKEY, "[]"); store.set(SKEY, "null"); }
  else{ store.set("pinHash", ""); store.set("pinSalt", ""); }
  hideBanner();
  buildSetup();
  updateFine();
  newChat();
}
async function startKids(){
  const t = T();
  const p1 = $("pin1").value.trim(), p2 = $("pin2").value.trim();
  if(!/^\d{4}$/.test(p1)) return setErr(t.errPinLen);
  if(p1 !== p2) return setErr(t.errPinMismatch);
  if(!$("consent").checked) return setErr(t.errConsent);
  const salt = randomSalt();
  store.set("pinSalt", salt);
  store.set("pinHash", await hashPin(p1, salt));
  setProfile("kids");
  hideOverlay();
}
async function checkPin(){
  const t = T();
  if(Date.now() < Number(store.get("pinLock") || 0)) return setErr(t.pinLocked);
  const pin = $("pinIn").value.trim();
  const stored = store.get("pinHash");
  const ok = !stored || (/^\d{4}$/.test(pin) && (await hashPin(pin, store.get("pinSalt") || "")) === stored);
  if(ok){ store.set("pinFails", "0"); setProfile("adult"); hideOverlay(); return; }
  const fails = Number(store.get("pinFails") || 0) + 1;
  if(fails >= 5){ store.set("pinFails", "0"); store.set("pinLock", String(Date.now() + 300000)); setErr(t.pinLocked); }
  else{ store.set("pinFails", String(fails)); setErr(t.pinWrong); }
}


/* ---------- accounts (Supabase over plain REST, no external library) ---------- */
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const isUuid = (x) => /^[0-9a-f-]{36}$/i.test(String(x || ""));
let pendingEmail = "", refreshing = null;

function updateAccountUI(){ $("menuBtn").classList.toggle("signed", !!state.session); }
function saveSession(x){
  if(x && x.access_token){
    state.session = {
      access_token: x.access_token,
      refresh_token: x.refresh_token,
      expires_at: x.expires_at || Math.floor(Date.now() / 1000) + (x.expires_in || 3600),
      user: { id: x.user && x.user.id, email: x.user && x.user.email }
    };
    store.set("sb_session", JSON.stringify(state.session));
  }else{
    state.session = null;
    store.set("sb_session", "");
  }
  updateAccountUI();
}
async function getToken(){
  const x = state.session;
  if(!x) return null;
  if(x.expires_at - 60 > Date.now() / 1000) return x.access_token;
  if(!refreshing){
    refreshing = (async () => {
      try{
        const r = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
          method:"POST",
          headers:{ apikey: SB_KEY, "Content-Type":"application/json" },
          body: JSON.stringify({ refresh_token: x.refresh_token })
        });
        if(r.status === 400 || r.status === 401 || r.status === 403){ saveSession(null); return null; }
        if(!r.ok) throw new Error("refresh " + r.status);
        saveSession(await r.json());
        return state.session ? state.session.access_token : null;
      }catch(e){ console.error(e); return null; }
      finally{ refreshing = null; }
    })();
  }
  return refreshing;
}
async function authHeaders(){
  const h = { "Content-Type":"application/json" };
  const tok = await getToken();
  if(tok) h.Authorization = "Bearer " + tok;
  return h;
}
async function sbRest(method, path, body, prefer){
  const tok = await getToken();
  if(!tok) throw new Error("not signed in");
  const headers = { apikey: SB_KEY, Authorization: "Bearer " + tok, "Content-Type":"application/json" };
  if(prefer) headers.Prefer = prefer;
  const r = await fetch(SB_URL + "/rest/v1" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if(!r.ok) throw new Error("REST " + r.status);
  if(r.status === 204) return null;
  return r.json().catch(() => null);
}
async function fetchAll(path){
  const out = [], page = 1000;
  for(let off = 0; ; off += page){
    const rows = await sbRest("GET", path + (path.includes("?") ? "&" : "?") + "limit=" + page + "&offset=" + off);
    out.push(...(rows || []));
    if(!rows || rows.length < page) break;
  }
  return out;
}

/* save chats for signed-in users (failures never block the chat) */
function persist(role, content){
  if(!state.session) return;
  state.saveChain = state.saveChain.then(async () => {
    try{
      if(!state.chatId){
        const rows = await sbRest("POST", "/chats", { title: content.slice(0, 60) }, "return=representation");
        state.chatId = rows && rows[0] && rows[0].id;
      }
      if(state.chatId) await sbRest("POST", "/messages", { chat_id: state.chatId, role, content: content.slice(0, 12000) }, "return=minimal");
    }catch(e){ console.error("save failed", e); }
  });

/* sign in with an emailed code */
function viewSignIn(){
  currentView = viewSignIn;
  const t = T();
  render('<h2>' + t.signIn + '</h2><p class="hint">' + t.signInHint + '</p>' +
    '<label class="fl" for="emailIn">' + t.emailLabel + '</label>' +
    '<input id="emailIn" class="txtin" type="email" inputmode="email" autocomplete="email" autocapitalize="off">' +
    '<label class="chk"><input type="checkbox" id="adultChk"><span>' + t.adultCheck + '</span></label>' +
    errBox() +
    '<button type="button" class="btn" data-act="sendCode">' + t.sendCode + '</button>' +
    '<button type="button" class="btn ghost" data-act="menu">' + t.cancel + '</button>' +
    legalLinks(), true);
}
function viewCode(email){
  pendingEmail = email;
  currentView = () => viewCode(email);
  const t = T();
  render('<h2>' + t.signIn + '</h2><p>' + esc(t.codeSent.replace("{e}", email)) + '</p>' +
    '<label class="fl" for="codeIn">' + t.codeLabel + '</label>' +
    '<input id="codeIn" class="txtin code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10">' +
    errBox() +
    '<button type="button" class="btn" data-act="verifyCode">' + t.verify + '</button>' +
    '<button type="button" class="btn ghost" data-act="signIn">' + t.back + '</button>', true);
}
async function sendCode(){
  const t = T();
  const email = ($("emailIn").value || "").trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr(t.errEmail);
  if(!$("adultChk").checked) return setErr(t.errAdult);
  setErr("");
  try{
    const r = await fetch(SB_URL + "/auth/v1/otp", {
      method:"POST",
      headers:{ apikey: SB_KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ email, create_user: true, data: { adult_confirmed: true } })
    });
    if(!r.ok) throw new Error("otp " + r.status);
    viewCode(email);
  }catch(e){ console.error(e); setErr(t.errSend); }
}
async function verifyCode(){
  const t = T();
  const token = ($("codeIn").value || "").replace(/\s/g, "");
  if(!/^\d{6,10}$/.test(token)) return setErr(t.errCode);
  try{
    const r = await fetch(SB_URL + "/auth/v1/verify", {
      method:"POST",
      headers:{ apikey: SB_KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ email: pendingEmail, token, type: "email" })
    });
    if(!r.ok) throw new Error("verify " + r.status);
    const x = await r.json();
    if(!x.access_token) throw new Error("no session");
    saveSession(x);
    hideOverlay();
  }catch(e){ console.error(e); setErr(t.errCode); }
}
async function doSignOut(){
  try{
    const tok = state.session && state.session.access_token;
    if(tok) await fetch(SB_URL + "/auth/v1/logout", { method:"POST", headers:{ apikey: SB_KEY, Authorization: "Bearer " + tok } });
  }catch{}
  saveSession(null);
  newChat();
  hideOverlay();
}

/* saved chats */
async function viewChats(){
  currentView = viewChats;
  const t = T();
  render('<h2>' + t.myChats + '</h2><div id="chatList" aria-live="polite">…</div>' +
    '<button type="button" class="btn ghost" data-act="menu">' + t.back + '</button>', true);
  try{
    const rows = await sbRest("GET", "/chats?select=id,title,updated_at&order=updated_at.desc&limit=30");
    const box = $("chatList");
    if(!box) return;
    box.innerHTML = rows && rows.length
      ? rows.map(c =>
          '<div class="chatrow"><button type="button" class="chatopen" data-act="openChat" data-id="' + esc(c.id) + '"><strong>' + esc(c.title || t.newChat) + '</strong><span>' + esc(new Date(c.updated_at).toLocaleDateString(state.lang)) + '</span></button>' +
          '<button type="button" class="chatdel" data-act="delChat" data-id="' + esc(c.id) + '" aria-label="' + esc(t.delChatLabel) + '" title="' + esc(t.delChatLabel) + '">' + TRASH + '</button></div>'
        ).join("")
      : '<p class="hint">' + t.noChats + '</p>';
  }catch(e){
    console.error(e);
    const box = $("chatList");
    if(box) box.innerHTML = '<p class="oerr">' + t.loadErr + '</p>';
  }
}
async function openChat(id){
  if(!isUuid(id)) return;
  try{
    const rows = await sbRest("GET", "/messages?chat_id=eq." + id + "&select=role,content&order=id.asc&limit=500");
    els.messages.innerHTML = "";
    state.messages = [];
    hideBanner();
    startConversation();
    state.messages = (rows || []).map(m => ({ role: m.role, content: m.content }));
    state.chatId = id;
    state.saveChain = Promise.resolve();
    state.messages.forEach(m => addMsg(m.role === "user" ? "user" : "bot", m.content));
    updateMode();
    hideOverlay();
    scrollDown();
  }catch(e){
    console.error(e);
    const box = $("chatList");
    if(box) box.innerHTML = '<p class="oerr">' + T().loadErr + '</p>';
  }
}
async function removeChat(id){
  if(!isUuid(id)) return;
  try{
    await sbRest("DELETE", "/chats?id=eq." + id);
    if(state.chatId === id) newChat();
    await viewChats();
  }catch(e){ console.error(e); const box = $("chatList"); if(box) box.innerHTML = '<p class="oerr">' + T().loadErr + '</p>'; }
}

/* data export and account deletion */
async function exportData(){
  try{
    const profile = await sbRest("GET", "/profiles?select=created_at,adult_confirmed_at,settings");
    const chats = await fetchAll("/chats?select=id,title,created_at,updated_at&order=created_at.asc");
    const messages = await fetchAll("/messages?select=chat_id,role,content,created_at&order=id.asc");
    const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), email: state.session.user.email, profile, chats, messages }, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "manualai-export.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }catch(e){ console.error(e); setErr(T().loadErr); }
}
