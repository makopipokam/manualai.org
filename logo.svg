<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Organic Lagoon / Pond Gradients -->
    <linearGradient id="pondGradLogo" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#1e5849"/>
      <stop offset="50%" stop-color="#143b31"/>
      <stop offset="100%" stop-color="#0c251e"/>
    </linearGradient>

    <linearGradient id="reefShelfGradLogo" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#2d7764" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#184a3d" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Star Glow & Shimmer -->
    <linearGradient id="starGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fff4da"/>
      <stop offset="100%" stop-color="#e8c170"/>
    </linearGradient>

    <!-- Coral Reef Accent -->
    <linearGradient id="coralAccentLogo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97051"/>
      <stop offset="100%" stop-color="#f0967d"/>
    </linearGradient>
  </defs>

  <style>
    .pond-base { fill: url(#pondGradLogo); }
    .reef-shelf { fill: url(#reefShelfGradLogo); }
    .reef-rim { stroke: url(#coralAccentLogo); stroke-width: 5; fill: none; stroke-linecap: round; opacity: 0.85; }
    .water-ripple { stroke: #62b39e; stroke-width: 3.5; fill: none; stroke-linecap: round; opacity: 0.45; }
    .star-core { fill: url(#starGradLogo); filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)); }
    .star-sparkle { fill: #fdfaf2; }
    @media (prefers-color-scheme: dark) {
      .water-ripple { stroke: #7ee0c8; opacity: 0.6; }
      .reef-rim { opacity: 0.95; }
    }
  </style>

  <!-- 1. Organic Pond / Reef Silhouette (Asymmetrical, natural fluid contours) -->
  <path class="pond-base" d="
    M 256,26
    C 362,24  448,88   476,182
    C 498,254 482,342  426,408
    C 372,472 290,490  210,482
    C 134,474  48,422   26,346
    C 4,268   28,188   84,116
    C 134,52  188,28   256,26
    Z
  "/>

  <!-- 2. Organic Reef Shelf / Shallow Water Layer -->
  <path class="reef-shelf" d="
    M 252,66
    C 336,66 414,118 438,198
    C 458,262 436,336 392,388
    C 346,442 278,454 212,444
    C 148,434  80,392   64,324
    C 46,252   68,188  118,132
    C 158,86  198,66   252,66
    Z
  "/>

  <!-- 3. Organic Reef Branch / Coral Arc Highlight -->
  <path class="reef-rim" d="
    M 92,316
    C 84,360 126,420 188,438
    C 242,454 316,442 368,406
  "/>

  <!-- 4. Delicate Concentric Pond Ripples -->
  <path class="water-ripple" d="
    M 154,204
    C 168,172 208,148 256,148
    C 304,148 344,172 358,204
  "/>
  <path class="water-ripple" d="
    M 142,284
    C 152,328 198,360 256,360
    C 314,360 360,328 370,284
  "/>

  <!-- 5. Bioluminescent Reef Droplets / Micro-Points -->
  <circle cx="168" cy="154" r="5.5" class="star-sparkle" opacity="0.75"/>
  <circle cx="356" cy="142" r="4.5" class="star-sparkle" opacity="0.65"/>
  <circle cx="374" cy="344" r="6"   class="star-sparkle" opacity="0.8"/>
  <circle cx="140" cy="358" r="4"   class="star-sparkle" opacity="0.6"/>

  <!-- 6. Iconic 4-Point Star (✦) Emerging From The Pond Center -->
  <path class="star-core" d="
    M 256,92
    Q 256,220 396,256
    Q 256,292 256,420
    Q 256,292 116,256
    Q 256,220 256,92
    Z
  "/>

  <!-- Star Inner Diamond Highlight (Subtle reflection / facets) -->
  <path d="
    M 256,180
    Q 256,242 318,256
    Q 256,270 256,332
    Q 256,270 194,256
    Q 256,242 256,180
    Z
  " fill="#ffffff" opacity="0.85"/>

  <!-- Radiant Center Micro-Spark -->
  <circle cx="256" cy="256" r="7" fill="#ffffff"/>
</svg>
