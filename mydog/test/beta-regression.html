<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyDog beta regression</title>
  <style>body{font:16px monospace;margin:2rem}#status{white-space:pre-wrap}</style>
</head>
<body>
  <h1>MyDog beta regression</h1>
  <pre id="status">RUNNING</pre>
  <iframe id="app" src="../index.html?beta-regression=1" style="width:100%;height:900px;border:0"></iframe>
  <script>
    const status = document.querySelector('#status');
    const frame = document.querySelector('#app');
    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };

    async function run() {
      await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      win.localStorage.clear();
      win.location.reload();
      await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));

      const app = frame.contentWindow;
      let page = frame.contentDocument;
      const click = selector => page.querySelector(selector)?.click();
      const active = () => page.querySelector('.screen.active')?.id;
      const state = () => JSON.parse(app.localStorage.getItem('mydog_appState') || '{}');

      click('#start-test-btn');
      assert(active() === 'test-screen', 'test start opens test screen');
      assert(page.querySelectorAll('.likert-option').length === 5, 'five numeric Likert options render');
      assert(page.querySelector('.likert-hint') === null, 'redundant orientation hint stays removed');
      assert(page.querySelector('.likert-labels') === null, 'descriptive labels stay removed');
      assert(page.querySelector('.test-navigation').firstElementChild?.id === 'next-question-btn', 'Weiter is above Zurück');
      assert(page.querySelector('.test-navigation').lastElementChild?.id === 'prev-question-btn', 'Zurück is below Weiter');
      assert(getComputedStyle(page.querySelector('#view-favorites-btn')).backgroundColor !== 'rgb(244, 67, 54)', 'favorites overview button is not red');

      // A partially completed test must survive a reload and resume at its saved question.
      page.querySelectorAll('.likert-option')[0].click();
      click('#next-question-btn');
      assert(page.querySelector('#progress-text').textContent === 'Frage 2 von 30', 'progress saves after moving to the next question');
      app.showScreen('start');
      await new Promise(resolve => {
        frame.addEventListener('load', resolve, { once: true });
        app.location.reload();
      });
      page = frame.contentDocument;
      assert(!page.querySelector('#saved-progress-panel').hidden, 'unfinished test resume panel renders after reload');
      click('#resume-test-btn');
      assert(active() === 'test-screen', 'unfinished test resumes on test screen');
      assert(page.querySelector('#progress-text').textContent === 'Frage 2 von 30', 'unfinished test resumes at saved question');
      app.startNewTest();
      assert(state().userAnswers.length === 0, 'fresh test clears partial answers before the full flow');

      for (let question = 0; question < 30; question += 1) {
        const options = page.querySelectorAll('.likert-option');
        assert(options.length === 5, `five options render on question ${question + 1}`);
        const selected = question % 5;
        options[selected].click();
        assert(!page.querySelector('#next-question-btn').disabled, `next enabled after answer ${question + 1}`);

        if (question === 0) {
          assert(state().userAnswers[0].likertValue === 0, 'first numeric answer persists as 0');
        }
        if (question === 1) {
          click('#next-question-btn');
          click('#prev-question-btn');
          assert(page.querySelector('.likert-option.selected')?.dataset.index === '1', 'back preserves selected answer');
          assert(!page.querySelector('#next-question-btn').disabled, 'back preserves ability to continue');
          click('#next-question-btn');
        } else {
          click('#next-question-btn');
        }
      }

      if (active() === 'test-screen' && page.querySelector('#progress-text')?.textContent === 'Frage 30 von 30') {
        app.nextQuestion();
      }
      await wait(1800);
      assert(active() === 'results-screen', `complete test opens results (active=${active()}, progress=${page.querySelector('#progress-text')?.textContent})`);
      assert(!page.querySelector('#results-screen h2')?.textContent.includes('Vorschlag für dich'), 'result heading does not repeat suggestion phrase');
      assert(page.querySelector('.ratings-overview h4')?.textContent === 'Eignung für dich:', 'overall stars are labeled as suitability');
      assert(page.querySelector('.profile-section-title')?.textContent === 'Rasse-Eigenschaften', 'attribute stars are grouped separately');
      assert(page.querySelector('.rating-caption')?.textContent.includes('5 Sterne = passt sehr gut'), 'suitability explanation renders');
      const completed = state();
      assert(completed.lastResult?.dogIds?.length > 0, 'completed result persists dog ids');
      assert(completed.lastResult.dogIds.length === 18, 'completed result persists every catalogue breed');
      assert(Object.values(completed.lastResult.userPersonality).every(Number.isFinite), 'personality scores are numeric');
      assert(JSON.stringify(completed.lastResult.userPersonality) === JSON.stringify({ O: 50, C: 42, E: 46, A: 50, N: 88 }), 'Likert endpoints map to the intended OCEAN directions');

      const firstDogImage = page.querySelector('#dog-image-main')?.getAttribute('src') || '';
      click('#next-dog-btn');
      assert(active() === 'results-screen', 'next dog stays on results screen');
      const transitionImage = page.querySelector('#dog-image-main');
      assert(transitionImage?.style.visibility === 'hidden' || transitionImage?.getAttribute('src') !== firstDogImage, 'next dog never shows the previous image during transition');
      await wait(1200);
      assert(transitionImage?.style.visibility === 'hidden' || transitionImage?.getAttribute('src') !== firstDogImage, 'next dog does not retain the previous image');
      assert([...page.querySelectorAll('.dog-image.thumbnail')].every(image => image.style.visibility !== 'hidden' || image.style.display === 'none'), 'deferred thumbnails do not reserve blank layout space');

      click('#chat-btn');
      assert(active() === 'chat-screen', 'chat opens from a result profile');
      page.querySelector('#user-message-input').value = '<img src=x onerror=alert(1)>';
      click('#send-message-btn');
      const userMessage = page.querySelector('.chat-message.user p');
      assert(userMessage?.textContent === '<img src=x onerror=alert(1)>', 'chat renders user text as text');
      assert(!userMessage?.innerHTML.includes('<img'), 'chat does not interpret user HTML');
      click('#back-to-results-btn');
      assert(active() === 'results-screen', 'chat returns to the result profile');

      click('#share-btn');
      assert(page.querySelector('#share-link-input').value.includes('?dog='), 'share link contains the selected dog id');
      click('.close-btn');

      click('#favorite-btn');
      assert(state().favorites.length === 1, 'favorite is persisted');
      assert(getComputedStyle(page.querySelector('#favorite-btn')).backgroundColor !== 'rgb(255, 64, 129)', 'favorite state is not red');
      app.showFavorites();
      assert(active() === 'favorites-screen', 'favorites overview opens');
      assert(page.querySelectorAll('.favorite-card').length === 1, 'favorite card renders');
      assert(page.querySelector('#favorites-count').textContent === '1', 'favorite count renders');
      assert(page.querySelector('.favorite-card .rating')?.textContent.includes('Eignung'), 'favorite stars are labeled as suitability');
      assert(getComputedStyle(page.querySelector('.favorites-header h2')).color !== 'rgb(76, 175, 80)', 'favorites overview has its own color');
      assert(getComputedStyle(page.querySelector('.remove-btn')).backgroundColor !== 'rgb(244, 67, 54)', 'favorites remove action is not red');
      click('.remove-btn');
      assert(state().favorites.length === 0, 'favorite removal persists');

      const savedForExhaustion = state();
      savedForExhaustion.lastResult.currentDogIndex = 0;
      app.localStorage.setItem('mydog_appState', JSON.stringify(savedForExhaustion));
      app.loadState();
      app.showScreen('start');
      page = frame.contentDocument;
      assert(getComputedStyle(page.querySelector('#resume-result-btn')).backgroundColor !== 'rgb(244, 67, 54)', 'Ergebnis anzeigen is not red');
      assert(page.querySelector('#resume-result-btn').textContent === 'Vorschläge ansehen', 'saved action uses suggestion wording');
      click('#resume-result-btn');
      assert(active() === 'results-screen', 'saved result restores');

      // The ranked result must include every catalogue breed before the ending screen.
      const seenBreeds = new Set();
      for (let breedIndex = 0; breedIndex < 18; breedIndex += 1) {
        seenBreeds.add(page.querySelector('#dog-breed')?.textContent);
        if (breedIndex < 17) app.showNextDog();
      }
      assert(seenBreeds.size === 18, `all catalogue breeds are available (seen=${seenBreeds.size}: ${[...seenBreeds].join(', ')})`);
      app.showNextDog();
      assert(active() === 'no-more-screen', 'all-breed catalogue ends on the completion screen');
      assert(page.querySelector('#no-more-screen h2')?.textContent.includes('Katzentyp'), 'cat-type ending is shown after all breeds');
      assert(page.querySelector('#shown-breed-count')?.textContent === '18', 'completion screen shows catalogue count');
      click('#restart-test-btn');
      assert(active() === 'start-screen', 'ending button returns to the start screen');
      assert(state().userAnswers.filter(Boolean).length === 30, 'ending button preserves completed answers');
      assert(!page.querySelector('#saved-result-panel').hidden, 'saved result remains available from the start screen');

      app.startNewTest();
      assert(active() === 'test-screen', 'retake opens a fresh test');
      assert(state().userAnswers.length === 0, 'retake clears saved answers');

      const optionsRect = page.querySelector('.likert-options').getBoundingClientRect();
      assert(optionsRect.right <= page.documentElement.clientWidth + 1, 'Likert options fit viewport');
      assert(optionsRect.width >= 260, 'Likert options remain touch-usable');

      status.textContent = `PASS\nviewport=${page.documentElement.clientWidth}x${page.documentElement.clientHeight}\nflows=30-question, back/next, resume, restore, shared-profile, chat, favorites, retake\nlikert=5 numeric options + OCEAN direction`;
      document.title = `PASS MyDog beta ${page.documentElement.clientWidth}px`;
    }

    run().catch(error => {
      status.textContent = `FAIL\n${error.stack || error}`;
      document.title = 'FAIL MyDog beta regression';
    });
  </script>
</body>
</html>
